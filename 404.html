  <title>404 | Η σελίδα δεν βρέθηκε - Ήχος Εικόνα Χρήστος</title>
  <meta name="robots" content="noindex">
  <script>
    /* Ο host σερβίρει αυτή τη σελίδα σε ΚΑΘΕ διεύθυνση που λείπει, σε οποιοδήποτε βάθος
       (π.χ. /hxos_eikona_xrhstos/en/a/b), οπότε οι σχετικές διαδρομές θα έδειχναν σε λάθος φάκελο.
       Βρίσκουμε τη ρίζα του site και τη δηλώνουμε με <base> πριν από το CSS, τα εικονίδια,
       το script και τους συνδέσμους:
       - GitHub Pages (έργο): η ρίζα είναι /hxos_eikona_xrhstos/
       - δικό του domain αργότερα: η διαδρομή δεν ξεκινά με το όνομα του repo, άρα ρίζα = /
         (δεν χρειάζεται καμία αλλαγή στη μετακόμιση)
       - διπλό κλικ (file://): η σελίδα είναι ήδη στη ρίζα, μένουν οι σχετικές διαδρομές
       Το CSS γράφεται εδώ (document.write) ώστε να μπλοκάρει το render όπως ένα κανονικό link
       και να μη ζητηθεί πρώτα από λάθος φάκελο. Χωρίς JS ισχύει το noscript από κάτω. */
    (function () {
      var root = '';
      if (location.protocol !== 'file:') {
        var repo = '/hxos_eikona_xrhstos/';
        root = location.pathname.toLowerCase().indexOf(repo) === 0 ? repo : '/';
      }
      document.write(
        (root ? "<base href='" + root + "'>" : '') +
        '<link rel="stylesheet" href="styles.css">' +
        '<script src="assets/js/glass.js" defer><\/script>'
      );
    })();
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
